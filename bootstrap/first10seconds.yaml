---
- name: Bootstrap selected Debian-family hosts
  hosts: "{{ target_hosts | default('managed_hosts') }}"
  become: true
  gather_facts: true
  serial: 1
  vars:
    bootstrap_user: "{{ ansible_user }}"
    bootstrap_ssh_port: "{{ ansible_port | default(22) }}"
    nvm_version: v0.40.5
    reboot_if_required: false

  pre_tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: This playbook supports Debian-family hosts only.

    - name: Require a supported kubectl architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture in ['x86_64', 'aarch64']
        fail_msg: This playbook supports x86_64 and aarch64 hosts only.

    - name: Look up the bootstrap user account
      ansible.builtin.getent:
        database: passwd
        key: "{{ bootstrap_user }}"

    - name: Record the bootstrap user home directory
      ansible.builtin.set_fact:
        bootstrap_user_home: "{{ getent_passwd[bootstrap_user][4] }}"

  tasks:
    - name: Update the APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - apache2-utils
          - ca-certificates
          - curl
          - fail2ban
          - git
          - gnupg
          - ncdu
          - nmap
          - python3-pip
          - ufw
          - unattended-upgrades
        state: present

    - name: Ensure Fail2ban is enabled and started
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: true
        state: started

    - name: Ensure Docker is installed and ready
      ansible.builtin.import_tasks: ../docker/tasks/ensure-docker.yaml
      vars:
        docker_managed_user: "{{ bootstrap_user }}"

    - name: Retrieve the latest stable kubectl release
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_stable_release
      changed_when: false

    - name: Set kubectl download facts
      ansible.builtin.set_fact:
        kubectl_version: "{{ kubectl_stable_release.content | trim }}"
        kubectl_architecture: >-
          {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture,
          ansible_facts.architecture) }}

    - name: Install the latest stable kubectl binary
      ansible.builtin.get_url:
        url: >-
          https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/
          {{ kubectl_architecture }}/kubectl
        checksum: >-
          sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/
          {{ kubectl_architecture }}/kubectl.sha256
        dest: /usr/local/bin/kubectl
        owner: root
        group: root
        mode: "0755"
        force: true

    - name: Check the installed NVM version
      ansible.builtin.shell: >-
        if [ -s "{{ bootstrap_user_home }}/.nvm/nvm.sh" ]; then
        . "{{ bootstrap_user_home }}/.nvm/nvm.sh" && nvm --version;
        fi
      args:
        executable: /bin/bash
      become_user: "{{ bootstrap_user }}"
      environment:
        HOME: "{{ bootstrap_user_home }}"
      register: installed_nvm_version
      changed_when: false

    - name: Download the pinned NVM installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh"
        dest: "/tmp/nvm-install-{{ nvm_version }}.sh"
        owner: root
        group: root
        mode: '0700'

    - name: Install or update NVM with its official installer
      ansible.builtin.command:
        cmd: "bash /tmp/nvm-install-{{ nvm_version }}.sh"
      become_user: "{{ bootstrap_user }}"
      environment:
        HOME: "{{ bootstrap_user_home }}"
        NVM_DIR: "{{ bootstrap_user_home }}/.nvm"
        PROFILE: "{{ bootstrap_user_home }}/.bashrc"
        NODE_VERSION: lts/*
      when: >-
        installed_nvm_version.stdout | trim !=
        (nvm_version | regex_replace('^v', ''))

    - name: Install and select the current Node.js LTS release
      ansible.builtin.shell: >-
        . "{{ bootstrap_user_home }}/.nvm/nvm.sh" &&
        nvm install --lts &&
        nvm alias default 'lts/*'
      args:
        executable: /bin/bash
      become_user: "{{ bootstrap_user }}"
      environment:
        HOME: "{{ bootstrap_user_home }}"
      register: nvm_lts_install
      changed_when: >-
        'is already installed' not in nvm_lts_install.stdout and
        'is already installed' not in nvm_lts_install.stderr

    - name: Verify the current Node.js LTS version
      ansible.builtin.shell: >-
        . "{{ bootstrap_user_home }}/.nvm/nvm.sh" && node --version
      args:
        executable: /bin/bash
      become_user: "{{ bootstrap_user }}"
      environment:
        HOME: "{{ bootstrap_user_home }}"
      register: node_lts_version
      changed_when: false

    - name: Display the installed Node.js LTS version
      ansible.builtin.debug:
        msg: "Installed Node.js LTS: {{ node_lts_version.stdout }}"

    - name: Enable UFW with a deny-by-default incoming policy
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
        logging: "on"

    - name: Allow and rate-limit SSH
      community.general.ufw:
        rule: limit
        port: "{{ bootstrap_ssh_port }}"
        proto: tcp

    - name: Allow HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report a pending reboot
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} requires a reboot. Re-run with
          -e reboot_if_required=true to reboot it automatically.
      when:
        - reboot_required.stat.exists
        - not (reboot_if_required | bool)

    - name: Reboot when required and explicitly enabled
      ansible.builtin.reboot:
        reboot_timeout: 3600
      when:
        - reboot_required.stat.exists
        - reboot_if_required | bool
