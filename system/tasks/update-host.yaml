---
- name: Require a Debian-family host
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: This playbook supports Debian-family hosts only.

- name: Require a single server and serial cluster maintenance
  ansible.builtin.assert:
    that:
      - groups.get('k3s_master', []) | length == 1
      - groups.get('k3s_master', []) | intersect(groups.get('k3s_workers', [])) | length == 0
      - ansible_play_batch | length == 1
      - not ansible_check_mode
    fail_msg: >-
      Cluster maintenance needs one server, disjoint server/worker groups, and
      one host per batch. Use --syntax-check and --list-hosts for offline review;
      --check cannot establish recovery after a drain or reboot.
  when: k3s_maintenance | default(false) | bool

- name: Resolve the Kubernetes node name
  ansible.builtin.set_fact:
    maintenance_node_name: "{{ k3s_node_name | default(ansible_facts.hostname) }}"
  when: k3s_maintenance | default(false) | bool

- name: Require a healthy cluster before disrupting a node
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../k3s/scripts/check-maintenance-health.py {{ maintenance_node_name | quote }}"
    executable: /usr/bin/python3
  delegate_to: "{{ groups['k3s_master'][0] }}"
  changed_when: false
  when: k3s_maintenance | default(false) | bool

- name: Drain the Kubernetes node using normal eviction and disruption budgets
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/k3s', 'kubectl', 'drain', maintenance_node_name,
          '--ignore-daemonsets', '--timeout=600s'] +
         (['--delete-emptydir-data'] if
          (k3s_drain_delete_emptydir_data | default(false) | bool) else []) }}
  delegate_to: "{{ groups['k3s_master'][0] }}"
  changed_when: true
  when: k3s_maintenance | default(false) | bool

- name: Update the APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Report a pending reboot
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} requires a reboot. Re-run with
      -e reboot_if_required=true to reboot it automatically.
  when:
    - reboot_required.stat.exists
    - not (reboot_if_required | default(false) | bool)

- name: Reboot when required and explicitly enabled
  ansible.builtin.reboot:
    reboot_timeout: 3600
  when:
    - reboot_required.stat.exists
    - reboot_if_required | default(false) | bool

- name: Wait for the Kubernetes node to become Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - "node/{{ maintenance_node_name }}"
      - --for=condition=Ready
      - --timeout=30s
      - --request-timeout=40s
  delegate_to: "{{ groups['k3s_master'][0] }}"
  register: maintenance_node_ready
  changed_when: false
  retries: 20
  delay: 10
  until: maintenance_node_ready.rc == 0
  when: k3s_maintenance | default(false) | bool

- name: Require a responsive kubelet before returning the node to scheduling
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - --raw
      - "/api/v1/nodes/{{ maintenance_node_name }}/proxy/healthz"
      - --request-timeout=20s
  delegate_to: "{{ groups['k3s_master'][0] }}"
  register: maintenance_kubelet_health
  changed_when: false
  retries: 20
  delay: 10
  until: maintenance_kubelet_health.rc == 0 and maintenance_kubelet_health.stdout == 'ok'
  when: k3s_maintenance | default(false) | bool

- name: Uncordon the recovered node
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, uncordon, "{{ maintenance_node_name }}"]
  delegate_to: "{{ groups['k3s_master'][0] }}"
  changed_when: true
  when: k3s_maintenance | default(false) | bool

- name: Require cluster and storage recovery before the next host
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/../k3s/scripts/check-maintenance-health.py {{ maintenance_node_name | quote }}"
    executable: /usr/bin/python3
  delegate_to: "{{ groups['k3s_master'][0] }}"
  register: maintenance_recovery
  changed_when: false
  retries: 60
  delay: 10
  until: maintenance_recovery.rc == 0
  when: k3s_maintenance | default(false) | bool

- name: Display the host uptime
  ansible.builtin.command: uptime
  changed_when: false
  register: maintenance_uptime

- name: Report the host uptime
  ansible.builtin.debug:
    var: maintenance_uptime.stdout
