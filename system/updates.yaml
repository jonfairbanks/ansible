---
- name: Update selected Ubuntu hosts
  hosts: "{{ target_hosts | default('managed_hosts') }}"
  become: true
  gather_facts: true
  serial: "{{ update_batch_size | default(1) }}"
  any_errors_fatal: true
  vars:
    reboot_if_required: false

  pre_tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: This playbook supports Debian-family hosts only.

  tasks:
    - name: Update the APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report a pending reboot
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} requires a reboot. Re-run with
          -e reboot_if_required=true to reboot it automatically.
      when:
        - reboot_required.stat.exists
        - not (reboot_if_required | bool)

    - name: Reboot when required and explicitly enabled
      ansible.builtin.reboot:
        reboot_timeout: 3600
      when:
        - reboot_required.stat.exists
        - reboot_if_required | bool

    - name: Verify node uptime after an automatic reboot
      ansible.builtin.command: uptime
      changed_when: false
      register: uptime
      when:
        - reboot_required.stat.exists
        - reboot_if_required | bool

    - name: Display node uptime after an automatic reboot
      ansible.builtin.debug:
        var: uptime.stdout_lines
      when:
        - reboot_required.stat.exists
        - reboot_if_required | bool
