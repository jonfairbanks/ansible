---
- name: Validate cluster role assignments before any updates
  hosts: "{{ target_hosts | default('managed_hosts') }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require every selected cluster member to have exactly one role
      ansible.builtin.assert:
        that:
          - groups.get('k3s_master', []) | length == 1
          - groups.get('k3s_master', []) | intersect(groups.get('k3s_workers', [])) | length == 0
          - inventory_hostname in (groups.get('k3s_master', []) + groups.get('k3s_workers', []))
        fail_msg: Assign every K3s cluster member to one disjoint server or worker role.
      when: inventory_hostname in (groups.get('k3s_cluster', []) + groups.get('k3s_master', []) + groups.get('k3s_workers', []))

- name: Update selected non-cluster Ubuntu hosts
  hosts: "{{ target_hosts | default('managed_hosts') }}:!k3s_cluster:!k3s_master:!k3s_workers"
  become: true
  gather_facts: true
  serial: "{{ update_batch_size | default(1) }}"
  any_errors_fatal: true
  tasks:
    - name: Update the host
      ansible.builtin.import_tasks: tasks/update-host.yaml

- name: Update selected K3s workers one at a time
  hosts: "{{ target_hosts | default('managed_hosts') }}:&k3s_workers"
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_maintenance: true
  tasks:
    - name: Update the host
      ansible.builtin.import_tasks: tasks/update-host.yaml

- name: Update the selected K3s server after workers recover
  hosts: "{{ target_hosts | default('managed_hosts') }}:&k3s_master"
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_maintenance: true
  tasks:
    - name: Update the host
      ansible.builtin.import_tasks: tasks/update-host.yaml
