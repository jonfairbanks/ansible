---
- name: Shut down selected hosts
  hosts: "{{ target_hosts | default('k3s_workers') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Request a non-blocking system power off
      ansible.builtin.command:
        argv:
          - systemctl
          - poweroff
          - --no-block
      changed_when: true

    - name: Report shutdown request dispatch
      ansible.builtin.debug:
        msg: "Shutdown request dispatched for {{ inventory_hostname }}"
