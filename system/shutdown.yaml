---
- name: Shut down selected hosts
  hosts: "{{ target_hosts | default('k3s_workers') }}"
  become: true
  gather_facts: false
  vars:
    shutdown_delay_minutes: 1

  pre_tasks:
    - name: Require a positive shutdown delay
      ansible.builtin.assert:
        that:
          - shutdown_delay_minutes | int >= 1
        fail_msg: Set shutdown_delay_minutes to at least 1.

  tasks:
    - name: Schedule a system power off
      ansible.builtin.command:
        argv:
          - /sbin/shutdown
          - --poweroff
          - "+{{ shutdown_delay_minutes | int }}"
      changed_when: true

    - name: Report scheduled shutdown
      ansible.builtin.debug:
        msg: >-
          Shutdown scheduled for {{ inventory_hostname }} in
          {{ shutdown_delay_minutes | int }} minute(s).
