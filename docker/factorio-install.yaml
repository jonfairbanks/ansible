---
- name: Install and run Factorio
  hosts: "{{ target_hosts | default('managed_hosts') }}"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Ensure Docker is installed and ready
      ansible.builtin.import_tasks: tasks/ensure-docker.yaml
  tasks:
    - name: Create the Factorio data directory
      ansible.builtin.file:
        path: /opt/factorio
        state: directory
        owner: '845'
        group: '845'
        mode: '0755'

    - name: Allow Factorio UDP traffic
      community.general.ufw:
        rule: allow
        port: '34197'
        proto: udp

    - name: Run the Factorio container
      community.docker.docker_container:
        name: factorio
        image: factoriotools/factorio
        restart_policy: always
        state: started
        exposed_ports:
          - '34197'
        ports:
          - '34197:34197/udp'
        volumes:
          - /opt/factorio:/factorio
