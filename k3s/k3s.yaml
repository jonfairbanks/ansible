---
# Usage:
#   ansible-playbook k3s/k3s.yaml

- name: Install and configure the K3s server
  hosts: k3s_master
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - versions.yaml
  vars:
    k3s_install_script_url: https://get.k3s.io
    k3s_install_script_path: /tmp/k3s-install.sh
    k3s_server_extra_args: ''
    traefik_dashboard_enabled: false
    traefik_dashboard_namespace: kube-system
    traefik_dashboard_hostname: traefik.home.arpa
    traefik_dashboard_username: admin
    traefik_dashboard_password: ''
    traefik_dashboard_auth_secret_name: traefik-dashboard-auth
    traefik_dashboard_manifest_path: /etc/rancher/k3s/traefik-dashboard.yaml
    traefik_dashboard_htpasswd_package: apache2-utils
    traefik_dashboard_display_initial_credentials: false

  pre_tasks:
    - name: Require a pinned K3s version
      ansible.builtin.assert:
        that:
          - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
        fail_msg: Set k3s_version in k3s/versions.yaml to an exact K3s release.
      run_once: true

    - name: Require exactly one K3s server in the inventory
      ansible.builtin.assert:
        that:
          - "'k3s_master' in groups"
          - groups['k3s_master'] | length == 1
        fail_msg: Define exactly one host in the [k3s_master] inventory group.
      run_once: true

    - name: Require a K3s API URL for the exported kubeconfig
      ansible.builtin.assert:
        that:
          - k3s_server_url is defined
          - k3s_server_url is match('^https://.+:6443$')
        fail_msg: Set k3s_server_url to the master API URL in the local inventory.
      run_once: true

    - name: Require a valid Traefik dashboard hostname
      ansible.builtin.assert:
        that:
          - traefik_dashboard_hostname is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$')
          - traefik_dashboard_username | length > 0
        fail_msg: >-
          Set traefik_dashboard_hostname to a fully qualified hostname and
          traefik_dashboard_username to a non-empty value.
      when: traefik_dashboard_enabled | bool

    - name: Check for the K3s node token
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_file

    - name: Check for an existing K3s server installation
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_server_binary

    - name: Read the installed K3s server version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - --version
      register: k3s_server_installed_version
      changed_when: false
      when: k3s_server_binary.stat.exists

    - name: Require the node token for an existing K3s server
      ansible.builtin.assert:
        that:
          - not k3s_server_binary.stat.exists or k3s_node_token_file.stat.exists
        fail_msg: >-
          The K3s binary exists but its node token is missing. Restore the server
          token before using this playbook so existing agents are not disrupted.

    - name: Read the existing K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: existing_k3s_node_token
      when: k3s_node_token_file.stat.exists
      no_log: true

    - name: Use the existing K3s node token
      ansible.builtin.set_fact:
        k3s_server_token: "{{ existing_k3s_node_token.content | b64decode | trim }}"
      when: k3s_node_token_file.stat.exists
      no_log: true

    - name: Generate the initial K3s node token
      ansible.builtin.set_fact:
        k3s_server_token: >-
          {{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}
      when: not k3s_node_token_file.stat.exists
      no_log: true

  tasks:
    - name: Create the K3s server configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Configure the K3s server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
        content: |
          token: "{{ k3s_server_token }}"
          write-kubeconfig-mode: "0600"
      no_log: true
      notify: Restart K3s server

    - name: Download the K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: "{{ k3s_install_script_path }}"
        owner: root
        group: root
        mode: '0700'

    - name: Install K3s server
      ansible.builtin.command:
        cmd: "{{ k3s_install_script_path }}"
      environment:
        K3S_TOKEN: "{{ k3s_server_token }}"
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode=0600 {{ k3s_server_extra_args }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: >-
        not ((k3s_server_installed_version.stdout | default('')) is match(
        '^k3s version ' ~ (k3s_version | regex_escape) ~ '(\s|$)'))
      no_log: true

    - name: Verify the pinned K3s server version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - --version
      register: k3s_server_version
      changed_when: false
      failed_when: >-
        not (k3s_server_version.stdout is match(
        '^k3s version ' ~ (k3s_version | regex_escape) ~ '(\s|$)'))

    - name: Create the K3s packaged-manifest directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure Traefik to preserve client source addresses
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/k3s-traefik-config.yaml
        owner: root
        group: root
        mode: '0644'
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              deployment:
                kind: DaemonSet
              resources:
                requests:
                  cpu: 100m
                  memory: 200Mi
              service:
                spec:
                  externalTrafficPolicy: Local

    - name: Apply K3s server configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for the K3s server API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        delay: 2
        timeout: 120

    - name: Verify the K3s server service is active
      ansible.builtin.command: systemctl is-active k3s
      changed_when: false

    - name: Wait for Traefik to preserve client source addresses
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - kube-system
          - get
          - service
          - traefik
          - --output=jsonpath={.spec.externalTrafficPolicy}
      changed_when: false
      register: k3s_traefik_traffic_policy
      retries: 30
      delay: 2
      until: k3s_traefik_traffic_policy.rc == 0 and k3s_traefik_traffic_policy.stdout == 'Local'

    - name: Wait for the Traefik DaemonSet
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - kube-system
          - get
          - daemonset
          - traefik
      changed_when: false
      register: k3s_traefik_daemonset
      retries: 30
      delay: 2
      until: k3s_traefik_daemonset.rc == 0

    - name: Wait for the Traefik DaemonSet rollout
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - kube-system
          - rollout
          - status
          - daemonset/traefik
          - --timeout=180s
      changed_when: false

    - name: Verify that the bundled Traefik dashboard is enabled
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - "{{ traefik_dashboard_namespace }}"
          - get
          - daemonset
          - traefik
          - --output=jsonpath={.spec.template.spec.containers[0].args}
      register: traefik_dashboard_args
      changed_when: false
      when: traefik_dashboard_enabled | bool

    - name: Require the bundled Traefik dashboard
      ansible.builtin.assert:
        that:
          - >-
            '--api.dashboard=true' in traefik_dashboard_args.stdout or
            '--api=true' in traefik_dashboard_args.stdout
        fail_msg: >-
          The bundled Traefik dashboard is disabled. Enable Traefik's API and
          dashboard in the K3s HelmChartConfig before enabling its route.
      when: traefik_dashboard_enabled | bool

    - name: Install the Traefik dashboard credential utility
      ansible.builtin.package:
        name: "{{ traefik_dashboard_htpasswd_package }}"
        state: present
      when: traefik_dashboard_enabled | bool

    - name: Check whether Traefik dashboard credentials already exist
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - "{{ traefik_dashboard_namespace }}"
          - get
          - secret
          - "{{ traefik_dashboard_auth_secret_name }}"
      register: traefik_dashboard_secret
      changed_when: false
      failed_when: >-
        traefik_dashboard_secret.rc != 0 and
        'NotFound' not in traefik_dashboard_secret.stderr
      when: traefik_dashboard_enabled | bool

    - name: Generate initial Traefik dashboard credentials
      ansible.builtin.set_fact:
        traefik_dashboard_initial_password: >-
          {{ traefik_dashboard_password | default(
          lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}
      no_log: true
      when:
        - traefik_dashboard_enabled | bool
        - traefik_dashboard_secret.rc != 0

    - name: Hash initial Traefik dashboard credentials
      ansible.builtin.command:
        argv:
          - htpasswd
          - -nbB
          - "{{ traefik_dashboard_username }}"
          - "{{ traefik_dashboard_initial_password }}"
      register: traefik_dashboard_htpasswd
      changed_when: false
      no_log: true
      when:
        - traefik_dashboard_enabled | bool
        - traefik_dashboard_secret.rc != 0

    - name: Create initial Traefik dashboard credentials
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --namespace
          - "{{ traefik_dashboard_namespace }}"
          - create
          - secret
          - generic
          - "{{ traefik_dashboard_auth_secret_name }}"
          - "--from-literal=users={{ traefik_dashboard_htpasswd.stdout }}"
      no_log: true
      when:
        - traefik_dashboard_enabled | bool
        - traefik_dashboard_secret.rc != 0

    - name: Write the Traefik dashboard route manifest
      ansible.builtin.copy:
        dest: "{{ traefik_dashboard_manifest_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: traefik-dashboard-auth
            namespace: {{ traefik_dashboard_namespace }}
          spec:
            basicAuth:
              secret: {{ traefik_dashboard_auth_secret_name }}
              removeHeader: true
          ---
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: traefik-dashboard
            namespace: {{ traefik_dashboard_namespace }}
          spec:
            entryPoints:
              - web
            routes:
              - kind: Rule
                match: Host(`{{ traefik_dashboard_hostname }}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
                middlewares:
                  - name: traefik-dashboard-auth
                services:
                  - kind: TraefikService
                    name: api@internal
      when: traefik_dashboard_enabled | bool

    - name: Apply the Traefik dashboard route
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --filename
          - "{{ traefik_dashboard_manifest_path }}"
      register: traefik_dashboard_apply
      changed_when: >-
        'created' in traefik_dashboard_apply.stdout or
        'configured' in traefik_dashboard_apply.stdout
      when: traefik_dashboard_enabled | bool

    - name: Display initial Traefik dashboard credentials
      ansible.builtin.debug:
        msg: >-
          Traefik dashboard: http://{{ traefik_dashboard_hostname }}/dashboard/
          username={{ traefik_dashboard_username }}
          password={{ traefik_dashboard_initial_password }}
      when:
        - traefik_dashboard_enabled | bool
        - traefik_dashboard_secret.rc != 0
        - traefik_dashboard_display_initial_credentials | bool

    - name: Read the K3s admin kubeconfig from the master
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_admin_kubeconfig
      no_log: true

    - name: Create the controller kubeconfig directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Write the K3s admin kubeconfig on the controller
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        content: >-
          {{ k3s_admin_kubeconfig.content | b64decode |
          regex_replace('https://127.0.0.1:6443', k3s_server_url) }}
        mode: '0600'
        backup: true
      delegate_to: localhost
      become: false
      no_log: true

  handlers:
    - name: Restart K3s server
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        enabled: true

- name: Install and configure K3s worker nodes
  hosts: k3s_workers
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - versions.yaml
  vars:
    k3s_install_script_url: https://get.k3s.io
    k3s_install_script_path: /tmp/k3s-install.sh
    k3s_agent_extra_args: ''
    k3s_worker_node_name: "{{ k3s_node_name | default(ansible_facts['hostname']) }}"

  pre_tasks:
    - name: Require a pinned K3s version
      ansible.builtin.assert:
        that:
          - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
        fail_msg: Set k3s_version in k3s/versions.yaml to an exact K3s release.
      run_once: true

    - name: Require a K3s server URL
      ansible.builtin.assert:
        that:
          - k3s_server_url | length > 0
          - k3s_server_url is match('^https://.+:6443$')
        fail_msg: Set k3s_server_url to the server API URL, for example https://192.168.1.10:6443.

    - name: Read the K3s node token from the server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['k3s_master'][0] }}"
      register: k3s_node_token
      no_log: true

    - name: Set the worker join token
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_node_token.content | b64decode | trim }}"
      no_log: true

    - name: Check for an existing K3s agent installation
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_agent_binary

    - name: Read the installed K3s agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - --version
      register: k3s_agent_installed_version
      changed_when: false
      when: k3s_agent_binary.stat.exists

  tasks:
    - name: Wait until the K3s server API is reachable
      ansible.builtin.wait_for:
        host: "{{ k3s_server_url | regex_replace('^https://([^:]+):6443$', '\\1') }}"
        port: 6443
        delay: 2
        timeout: 120

    - name: Create the K3s agent configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Configure the K3s agent
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
        content: |
          server: "{{ k3s_server_url }}"
          token: "{{ k3s_join_token }}"
      no_log: true
      notify: Restart K3s agent

    - name: Download the K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: "{{ k3s_install_script_path }}"
        owner: root
        group: root
        mode: '0700'

    - name: Install K3s agent
      ansible.builtin.command:
        cmd: "{{ k3s_install_script_path }}"
      environment:
        K3S_URL: "{{ k3s_server_url }}"
        K3S_TOKEN: "{{ k3s_join_token }}"
        INSTALL_K3S_EXEC: "agent {{ k3s_agent_extra_args }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: >-
        not ((k3s_agent_installed_version.stdout | default('')) is match(
        '^k3s version ' ~ (k3s_version | regex_escape) ~ '(\s|$)'))
      no_log: true

    - name: Verify the pinned K3s agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - --version
      register: k3s_agent_version
      changed_when: false
      failed_when: >-
        not (k3s_agent_version.stdout is match(
        '^k3s version ' ~ (k3s_version | regex_escape) ~ '(\s|$)'))

    - name: Apply K3s agent configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Verify the K3s agent service is active
      ansible.builtin.command: systemctl is-active k3s-agent
      changed_when: false

    - name: Wait for the worker node to register with the server
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - node
          - "{{ k3s_worker_node_name }}"
      changed_when: false
      register: k3s_worker_node
      retries: 30
      delay: 2
      until: k3s_worker_node.rc == 0
      delegate_to: "{{ groups['k3s_master'][0] }}"
      tags: node-labels

    - name: Wait for the worker node to become ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - "node/{{ k3s_worker_node_name }}"
          - --timeout=180s
      changed_when: false
      delegate_to: "{{ groups['k3s_master'][0] }}"
      tags: node-labels

    - name: Label the registered node as a worker
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - label
          - node
          - "{{ k3s_worker_node_name }}"
          - node-role.kubernetes.io/worker=
          - --overwrite
      register: k3s_worker_label
      changed_when: "'not labeled' not in k3s_worker_label.stdout"
      delegate_to: "{{ groups['k3s_master'][0] }}"
      tags: node-labels

  handlers:
    - name: Restart K3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
        enabled: true
