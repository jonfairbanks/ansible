---
- name: Require unambiguous K3s roles and an API server
  ansible.builtin.assert:
    that:
      - groups.get('k3s_master', []) | length >= 1
      - groups.get('k3s_master', []) | intersect(groups.get('k3s_workers', [])) | length == 0
    fail_msg: Define one or more K3s servers and disjoint server/worker inventory groups.

- name: Require explicit reservation and eviction inputs for each selected host
  ansible.builtin.assert:
    that:
      - k3s_node_resource_profile is defined
      - k3s_node_resource_profile is mapping
      - k3s_node_eviction_hard is defined
      - k3s_node_eviction_hard is mapping
    fail_msg: >-
      Supply k3s_node_resource_profile and k3s_node_eviction_hard in this host's
      inventory variables. There are no built-in resource sizes or thresholds.

- name: Require complete reservation and eviction maps
  ansible.builtin.assert:
    that:
      - k3s_node_resource_profile.keys() | sort == ['kubeReserved', 'systemReserved']
      - k3s_node_resource_profile.systemReserved is mapping
      - k3s_node_resource_profile.kubeReserved is mapping
      - k3s_node_resource_profile.systemReserved.keys() | sort == ['cpu', 'memory']
      - k3s_node_resource_profile.kubeReserved.keys() | sort == ['cpu', 'memory']
      - k3s_node_eviction_hard.keys() | sort == ['imagefs.available', 'imagefs.inodesFree', 'memory.available', 'nodefs.available', 'nodefs.inodesFree']
    fail_msg: Supply both CPU/memory reservations and all five eviction thresholds.

- name: Reject unfilled template values
  ansible.builtin.assert:
    that:
      - item is not none
      - item is string
      - item | length > 0
    fail_msg: Replace every template null with an operator-reviewed value, quoted as a string.
  loop: >-
    {{ (k3s_node_resource_profile.systemReserved.values() | list) +
       (k3s_node_resource_profile.kubeReserved.values() | list) +
       (k3s_node_eviction_hard.values() | list) }}

- name: Require a selected canary before broader rollout
  ansible.builtin.assert:
    that:
      - >-
        (k3s_node_resources_canary_verified | default(false) | bool)
        or (ansible_play_hosts_all | length == 1 and
            inventory_hostname == (k3s_node_resources_canary_host | default('')))
    fail_msg: >-
      Select one representative host with --limit and set
      k3s_node_resources_canary_host to that inventory alias. Observe your
      representative workload and background maintenance before setting
      k3s_node_resources_canary_verified=true for a broader rollout.
