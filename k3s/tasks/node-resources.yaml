---
- name: Require serial execution for the resource rollout
  ansible.builtin.assert:
    that:
      - ansible_play_batch | length == 1
      - not ansible_check_mode
    fail_msg: >-
      Use one host per batch.
      Review with --syntax-check and --list-hosts; --check cannot verify an
      effective kubelet configuration after restart.

- name: Read the installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: node_resources_version
  changed_when: false

- name: Require K3s kubelet drop-in support
  ansible.builtin.assert:
    that:
      - node_resources_version.stdout is search('k3s version v1\.[0-9]+\.[0-9]+')
      - (node_resources_version.stdout | regex_search('v1\.[0-9]+\.[0-9]+') | regex_replace('^v', '')) is version('1.32.0', '>=')
    fail_msg: Kubelet configuration drop-ins require K3s 1.32 or newer.

- name: Select the reviewed profile and Kubernetes node name
  ansible.builtin.set_fact:
    node_resources_profile: "{{ k3s_node_resource_profile }}"
    node_resources_name: "{{ k3s_node_name | default(ansible_facts.hostname) }}"
    node_resources_api_host: >-
      {{ k3s_node_resources_api_host | default(
        ((groups['k3s_master'] | difference([inventory_hostname])) +
         groups['k3s_master']) | first) }}

- name: Build the managed kubelet configuration
  ansible.builtin.set_fact:
    node_resources_config: >-
      {{ node_resources_profile | combine({
        'apiVersion': 'kubelet.config.k8s.io/v1beta1',
        'kind': 'KubeletConfiguration',
        'evictionHard': k3s_node_eviction_hard,
        'enforceNodeAllocatable': ['pods']}) }}

- name: Check projected allocatable against current pod requests and usage
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/scripts/verify-node-resources.py preflight
      {{ node_resources_name | quote }} {{ node_resources_config | to_json | quote }}
    executable: /usr/bin/python3
  delegate_to: "{{ node_resources_api_host }}"
  changed_when: false

- name: Create the K3s kubelet drop-in directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write the managed node-resource drop-in
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/20-ansible-node-resources.conf
    content: "{{ node_resources_config | to_nice_yaml(indent=2) }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
  register: node_resources_dropin

- name: Restart K3s when the resource profile changes
  ansible.builtin.systemd_service:
    name: "{{ k3s_resource_service }}"
    state: restarted
  when: node_resources_dropin.changed

- name: Verify effective reservations and allocatable before the next node
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/scripts/verify-node-resources.py verify
      {{ node_resources_name | quote }} {{ node_resources_config | to_json | quote }}
    executable: /usr/bin/python3
  delegate_to: "{{ node_resources_api_host }}"
  register: node_resources_verified
  changed_when: false
  retries: 60
  delay: 10
  until: node_resources_verified.rc == 0
