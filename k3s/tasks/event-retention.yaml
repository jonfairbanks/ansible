---
- name: Create the K3s Configuration Drop-In Directory
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Retain Kubernetes Events for 24 Hours
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml.d/10-event-retention.yaml
    backup: true
    owner: root
    group: root
    mode: '0600'
    content: |
      kube-apiserver-arg+:
        - event-ttl=24h
  notify: Restart K3s server
