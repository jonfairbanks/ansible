---
- name: Validate all selected node profiles before changing any host
  hosts: k3s_workers:k3s_master
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate operator-supplied inputs
      ansible.builtin.import_tasks: tasks/validate-node-resource-inputs.yaml

- name: Configure K3s worker resource reservations one at a time
  hosts: k3s_workers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_resource_service: k3s-agent
  tasks:
    - name: Reconcile the kubelet resource profile
      ansible.builtin.import_tasks: tasks/node-resources.yaml

- name: Configure K3s servers one at a time after workers recover
  hosts: k3s_master
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_resource_service: k3s
  tasks:
    - name: Reconcile the kubelet resource profile
      ansible.builtin.import_tasks: tasks/node-resources.yaml
