---
- name: Configure K3s worker resource reservations one at a time
  hosts: k3s_workers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars_files:
    - node-resource-profiles.yaml
  vars:
    k3s_resource_role: worker
    k3s_resource_service: k3s-agent
  tasks:
    - name: Reconcile the kubelet resource profile
      ansible.builtin.import_tasks: tasks/node-resources.yaml

- name: Configure the K3s server after workers recover
  hosts: k3s_master
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars_files:
    - node-resource-profiles.yaml
  vars:
    k3s_resource_role: server
    k3s_resource_service: k3s
  tasks:
    - name: Reconcile the kubelet resource profile
      ansible.builtin.import_tasks: tasks/node-resources.yaml
