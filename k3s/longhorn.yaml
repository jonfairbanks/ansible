---
# Usage:
#   ansible-playbook k3s/longhorn.yaml
#
# Prepares Debian-family K3s nodes for the Longhorn Application managed in the
# cluster-state repository.

- name: Prepare K3s nodes for Longhorn
  hosts: k3s
  become: true
  gather_facts: true
  vars:
    longhorn_backup_host: 192.168.4.2
    longhorn_backup_port: 445
    longhorn_host_packages:
      - cifs-utils
      - open-iscsi
      - nfs-common
    longhorn_unused_multipath_units:
      - multipathd.service
      - multipathd.socket

  pre_tasks:
    - name: Require Debian-family K3s nodes
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          This playbook currently prepares Debian-family nodes. Add the
          appropriate iSCSI and NFS client packages before using another OS.

    - name: Check that K3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: longhorn_k3s_binary

    - name: Require K3s on every cluster node
      ansible.builtin.assert:
        that:
          - longhorn_k3s_binary.stat.exists
          - longhorn_k3s_binary.stat.executable
        fail_msg: Run k3s/k3s.yaml successfully before installing Longhorn.

  tasks:
    - name: Install Longhorn host prerequisites
      ansible.builtin.package:
        name: "{{ longhorn_host_packages }}"
        state: present

    - name: Discover installed multipath units
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - list-unit-files
          - "{{ item }}"
          - --no-legend
      loop: "{{ longhorn_unused_multipath_units }}"
      register: longhorn_multipath_units
      changed_when: false
      failed_when: false

    - name: Disable unused multipath units
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        enabled: false
        masked: true
        state: stopped
      loop: "{{ longhorn_multipath_units.results }}"
      when: item.stdout | trim | length > 0

    - name: Load the iSCSI TCP kernel module
      ansible.builtin.command:
        argv:
          - /usr/sbin/modprobe
          - iscsi_tcp
      changed_when: false

    - name: Enable the iSCSI daemon
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started

    - name: Verify the CIFS mount helper is installed
      ansible.builtin.stat:
        path: /usr/sbin/mount.cifs
      register: longhorn_mount_cifs

    - name: Require an executable CIFS mount helper
      ansible.builtin.assert:
        that:
          - longhorn_mount_cifs.stat.exists
          - longhorn_mount_cifs.stat.executable
        fail_msg: cifs-utils did not install an executable /usr/sbin/mount.cifs.

    - name: Verify SMB backup-host connectivity
      ansible.builtin.wait_for:
        host: "{{ longhorn_backup_host }}"
        port: "{{ longhorn_backup_port }}"
        state: started
        timeout: 5

    - name: Check whether the multipath client is installed
      ansible.builtin.stat:
        path: /usr/sbin/multipath
      register: longhorn_multipath_client

    - name: Inspect active multipath maps
      ansible.builtin.command:
        argv:
          - /usr/sbin/multipath
          - -ll
      register: longhorn_multipath_maps
      changed_when: false
      when: longhorn_multipath_client.stat.exists

    - name: Require no active multipath maps
      ansible.builtin.assert:
        that:
          - longhorn_multipath_maps.stdout | trim | length == 0
        fail_msg: >-
          Active multipath maps remain on this host. Review them before using
          Longhorn; multipath must not claim Longhorn block devices.
      when: longhorn_multipath_client.stat.exists
