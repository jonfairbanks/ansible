---
# Usage:
#   ansible-playbook k3s/longhorn.yaml
#
# Prepares Debian-family K3s nodes for Longhorn, then creates an Argo CD
# Application that installs and reconciles the pinned Longhorn Helm chart.

- name: Prepare K3s nodes for Longhorn
  hosts: k3s
  become: true
  gather_facts: true
  vars:
    longhorn_host_packages:
      - open-iscsi
      - nfs-common

  pre_tasks:
    - name: Require Debian-family K3s nodes
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          This playbook currently prepares Debian-family nodes. Add the
          appropriate iSCSI and NFS client packages before using another OS.

    - name: Check that K3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: longhorn_k3s_binary

    - name: Require K3s on every cluster node
      ansible.builtin.assert:
        that:
          - longhorn_k3s_binary.stat.exists
          - longhorn_k3s_binary.stat.executable
        fail_msg: Run k3s/k3s.yaml successfully before installing Longhorn.

  tasks:
    - name: Install Longhorn host prerequisites
      ansible.builtin.package:
        name: "{{ longhorn_host_packages }}"
        state: present

    - name: Load the iSCSI TCP kernel module
      ansible.builtin.command:
        argv:
          - /usr/sbin/modprobe
          - iscsi_tcp
      changed_when: false

    - name: Enable the iSCSI daemon
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started

- name: Install Longhorn through Argo CD
  hosts: k3s_master
  become: true
  gather_facts: false
  vars:
    longhorn_version: v1.12.0
    longhorn_application_name: longhorn
    longhorn_argocd_namespace: argocd
    longhorn_namespace: longhorn-system
    longhorn_chart_repository: https://charts.longhorn.io/
    longhorn_manifest_path: /etc/rancher/k3s/longhorn-application.yaml
    longhorn_data_path: /var/lib/longhorn
    longhorn_default_storage_class: true
    longhorn_replica_count: >-
      {{ 3 if groups['k3s'] | length >= 3 else groups['k3s'] | length }}

  pre_tasks:
    - name: Require exactly one K3s server in the inventory
      ansible.builtin.assert:
        that:
          - "'k3s_master' in groups"
          - groups['k3s_master'] | length == 1
          - "'k3s' in groups"
          - groups['k3s'] | length >= 1
        fail_msg: >-
          Define exactly one host in [k3s_master] and at least one host in the
          [k3s] cluster group.
      run_once: true

    - name: Require a released Longhorn version
      ansible.builtin.assert:
        that:
          - longhorn_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
          - longhorn_replica_count | int >= 1
          - longhorn_replica_count | int <= groups['k3s'] | length
          - longhorn_data_path is match('^/.+')
        fail_msg: >-
          Use a released Longhorn version, an absolute data path, and a replica
          count between one and the number of K3s nodes.

    - name: Check that the Argo CD Application CRD exists
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - customresourcedefinition
          - applications.argoproj.io
      register: longhorn_argocd_crd
      changed_when: false
      failed_when: false

    - name: Require Argo CD before installing Longhorn
      ansible.builtin.assert:
        that:
          - longhorn_argocd_crd.rc == 0
        fail_msg: Run k3s/argocd.yaml successfully before installing Longhorn.

  tasks:
    - name: Write the Longhorn Argo CD Application manifest
      ansible.builtin.copy:
        dest: "{{ longhorn_manifest_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: {{ longhorn_application_name }}
            namespace: {{ longhorn_argocd_namespace }}
          spec:
            project: default
            source:
              chart: longhorn
              repoURL: {{ longhorn_chart_repository }}
              targetRevision: {{ longhorn_version }}
              helm:
                releaseName: longhorn
                values: |
                  preUpgradeChecker:
                    jobEnabled: false
                  defaultSettings:
                    defaultDataPath: {{ longhorn_data_path }}
                  persistence:
                    defaultClass: {{ longhorn_default_storage_class | bool | ternary('true', 'false') }}
                    defaultClassReplicaCount: {{ longhorn_replica_count | int }}
            destination:
              server: https://kubernetes.default.svc
              namespace: {{ longhorn_namespace }}
            syncPolicy:
              automated:
                prune: false
                selfHeal: true
              retry:
                limit: 5
                backoff:
                  duration: 10s
                  factor: 2
                  maxDuration: 3m
              syncOptions:
                - CreateNamespace=true
                - ApplyOutOfSyncOnly=true

    - name: Apply the Longhorn Argo CD Application
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --filename
          - "{{ longhorn_manifest_path }}"
      register: longhorn_application_apply
      changed_when: >-
        'created' in longhorn_application_apply.stdout or
        'configured' in longhorn_application_apply.stdout

    - name: Wait for Argo CD to sync Longhorn
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - "application/{{ longhorn_application_name }}"
          - --namespace
          - "{{ longhorn_argocd_namespace }}"
          - --for=jsonpath={.status.sync.status}=Synced
          - --timeout=600s
      changed_when: false

    - name: Wait for Argo CD to report Longhorn healthy
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - "application/{{ longhorn_application_name }}"
          - --namespace
          - "{{ longhorn_argocd_namespace }}"
          - --for=jsonpath={.status.health.status}=Healthy
          - --timeout=600s
      changed_when: false

    - name: Verify the Longhorn manager rollout
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - daemonset/longhorn-manager
          - --namespace
          - "{{ longhorn_namespace }}"
          - --timeout=300s
      changed_when: false

    - name: Verify the Longhorn CSI driver rollout
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - deployment/longhorn-driver-deployer
          - --namespace
          - "{{ longhorn_namespace }}"
          - --timeout=300s
      changed_when: false

    - name: Wait for every Longhorn pod to become ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - pod
          - --all
          - --namespace
          - "{{ longhorn_namespace }}"
          - --for=condition=Ready
          - --timeout=30s
      register: longhorn_pods_ready
      changed_when: false
      retries: 20
      delay: 10
      until: longhorn_pods_ready.rc == 0
