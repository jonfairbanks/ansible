---
# Usage:
#   ansible-playbook k3s/argocd.yaml
#
# Installs the official Argo CD manifest on the K3s server. Override
# argocd_version only with a released, supported version.

- name: Install Argo CD on K3s
  hosts: k3s_master
  become: true
  gather_facts: false
  vars:
    argocd_version: v3.4.2
    argocd_namespace: argocd
    argocd_install_profile: standard
    argocd_hostname: argocd.home.arpa
    argocd_ingress_manifest_path: /etc/rancher/k3s/argocd-ingress.yaml
    argocd_display_initial_credentials: false
    argocd_state_repository_enabled: false
    argocd_state_repository_name: cluster-state
    argocd_state_repository_url: git@github.com:jonfairbanks/cluster-state.git
    argocd_state_repository_ssh_private_key: ''
    argocd_state_repository_vault_file: "{{ playbook_dir }}/argocd-vault.yaml"
    argocd_state_repository_manifest_path: /tmp/argocd-state-repository.yaml
    argocd_manifest_path: >-
      {{ 'manifests/ha/install.yaml'
      if argocd_install_profile == 'ha'
      else 'manifests/install.yaml' }}
    argocd_manifest_url: >-
      https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/{{ argocd_manifest_path }}

  pre_tasks:
    - name: Load state repository credentials from Ansible Vault
      ansible.builtin.include_vars:
        file: "{{ argocd_state_repository_vault_file }}"
      no_log: true
      when: argocd_state_repository_enabled | bool

    - name: Require exactly one K3s server in the inventory
      ansible.builtin.assert:
        that:
          - "'k3s_master' in groups"
          - groups['k3s_master'] | length == 1
        fail_msg: Define exactly one host in the [k3s_master] inventory group.
      run_once: true

    - name: Require a released Argo CD version
      ansible.builtin.assert:
        that:
          - argocd_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
        fail_msg: Set argocd_version to a released version, for example v3.4.2.

    - name: Require a supported Argo CD installation profile
      ansible.builtin.assert:
        that:
          - argocd_install_profile in ['standard', 'ha']
        fail_msg: Set argocd_install_profile to standard or ha.

    - name: Require a valid Argo CD hostname
      ansible.builtin.assert:
        that:
          - argocd_hostname is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$')
        fail_msg: Set argocd_hostname to a fully qualified hostname, for example argocd.home.arpa.

    - name: Require state repository credentials when enabled
      ansible.builtin.assert:
        that:
          - argocd_state_repository_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
          - argocd_state_repository_url is match('^git@[^:]+:.+\\.git$')
          - argocd_state_repository_ssh_private_key | length > 0
        fail_msg: >-
          Set argocd_state_repository_ssh_private_key from an Ansible
          Vault-encrypted variable before enabling the state repository.
      no_log: true
      when: argocd_state_repository_enabled | bool

    - name: Check that K3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Require an installed K3s server
      ansible.builtin.assert:
        that:
          - k3s_binary.stat.exists
          - k3s_binary.stat.executable
        fail_msg: Run k3s/k3s.yaml successfully before installing Argo CD.

  tasks:
    - name: Check whether the Argo CD namespace exists
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - namespace
          - "{{ argocd_namespace }}"
      register: argocd_namespace_status
      changed_when: false
      failed_when: >-
        argocd_namespace_status.rc != 0 and
        'NotFound' not in argocd_namespace_status.stderr

    - name: Create the Argo CD namespace
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - create
          - namespace
          - "{{ argocd_namespace }}"
      register: argocd_namespace_result
      when: argocd_namespace_status.rc != 0

    - name: Apply the pinned Argo CD manifest
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --server-side
          - --force-conflicts
          - --namespace
          - "{{ argocd_namespace }}"
          - --filename
          - "{{ argocd_manifest_url }}"
      register: argocd_apply
      changed_when: >-
        'created' in argocd_apply.stdout or 'configured' in argocd_apply.stdout

    - name: Write the Argo CD Traefik ingress manifest
      ansible.builtin.copy:
        dest: "{{ argocd_ingress_manifest_path }}"
        owner: root
        group: root
        mode: '0600'
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: argocd-server
            namespace: {{ argocd_namespace }}
          spec:
            ingressClassName: traefik
            rules:
              - host: {{ argocd_hostname }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: argocd-server-ingress
                          port:
                            number: 443
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: argocd-server-ingress
            namespace: {{ argocd_namespace }}
            annotations:
              traefik.ingress.kubernetes.io/service.serversscheme: https
              traefik.ingress.kubernetes.io/service.serverstransport: {{ argocd_namespace }}-argocd-server-https@kubernetescrd
          spec:
            selector:
              app.kubernetes.io/name: argocd-server
            ports:
              - name: https
                port: 443
                protocol: TCP
                targetPort: 8080
          ---
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: argocd-server-https
            namespace: {{ argocd_namespace }}
          spec:
            # Argo CD's upstream manifest uses a self-signed server certificate.
            insecureSkipVerify: true

    - name: Apply the Argo CD Traefik ingress
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --namespace
          - "{{ argocd_namespace }}"
          - --filename
          - "{{ argocd_ingress_manifest_path }}"
      register: argocd_ingress_apply
      changed_when: >-
        'created' in argocd_ingress_apply.stdout or 'configured' in argocd_ingress_apply.stdout

    - name: Wait for the Argo CD server deployment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - deployment/argocd-server
          - --namespace
          - "{{ argocd_namespace }}"
          - --timeout=300s
      changed_when: false

    - name: Wait for the Argo CD application controller
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - statefulset/argocd-application-controller
          - --namespace
          - "{{ argocd_namespace }}"
          - --timeout=300s
      changed_when: false

    - name: Register the Argo CD state repository
      block:
        - name: Write the Argo CD state repository credentials
          ansible.builtin.copy:
            dest: "{{ argocd_state_repository_manifest_path }}"
            owner: root
            group: root
            mode: '0600'
            content: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ argocd_state_repository_name }}
                namespace: {{ argocd_namespace }}
                labels:
                  argocd.argoproj.io/secret-type: repository
              stringData:
                type: git
                url: {{ argocd_state_repository_url }}
                sshPrivateKey: |
              {{ argocd_state_repository_ssh_private_key | indent(6, true) }}

        - name: Apply the Argo CD state repository credentials
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - apply
              - --namespace
              - "{{ argocd_namespace }}"
              - --filename
              - "{{ argocd_state_repository_manifest_path }}"
          register: argocd_state_repository_apply
          changed_when: >-
            'created' in argocd_state_repository_apply.stdout or
            'configured' in argocd_state_repository_apply.stdout
      always:
        - name: Remove the temporary Argo CD state repository manifest
          ansible.builtin.file:
            path: "{{ argocd_state_repository_manifest_path }}"
            state: absent
      no_log: true
      when: argocd_state_repository_enabled | bool

    - name: Verify the Argo CD state repository registration
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - secret
          - "{{ argocd_state_repository_name }}"
          - --namespace
          - "{{ argocd_namespace }}"
      changed_when: false
      when: argocd_state_repository_enabled | bool

    - name: Read the initial Argo CD admin password
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - secret
          - argocd-initial-admin-secret
          - --namespace
          - "{{ argocd_namespace }}"
          - --output
          - jsonpath={.data.password}
      register: argocd_initial_admin_password_encoded
      changed_when: false
      failed_when: false
      no_log: true
      when: argocd_display_initial_credentials | bool

    - name: Decode the initial Argo CD admin password
      ansible.builtin.set_fact:
        argocd_initial_admin_password: >-
          {{ argocd_initial_admin_password_encoded.stdout | b64decode }}
      no_log: true
      when:
        - argocd_display_initial_credentials | bool
        - argocd_initial_admin_password_encoded.rc == 0

    - name: Report when initial Argo CD credentials are unavailable
      ansible.builtin.debug:
        msg: >-
          The initial Argo CD credentials are unavailable. They may already have
          been removed after the first successful login.
      when:
        - argocd_display_initial_credentials | bool
        - argocd_initial_admin_password_encoded.rc != 0

    - name: Display initial Argo CD credentials
      ansible.builtin.debug:
        msg:
          username: admin
          password: "{{ argocd_initial_admin_password }}"
      when:
        - argocd_display_initial_credentials | bool
        - argocd_initial_admin_password_encoded.rc == 0
