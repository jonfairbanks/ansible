# Copy to hosts.ini and replace the placeholder aliases and addresses.
[managed_hosts]
control_plane ansible_host=192.0.2.10
worker_1 ansible_host=192.0.2.11
worker_2 ansible_host=192.0.2.12
worker_3 ansible_host=192.0.2.13

# SSH connection settings inherited by every managed host.
[managed_hosts:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

# Cluster membership includes control-plane and worker hosts.
[k3s_cluster]
control_plane
worker_1
worker_2
worker_3

# K3s installation roles.
[k3s_master]
control_plane

[k3s_workers]
worker_1
worker_2
worker_3

[k3s:children]
k3s_master
k3s_workers

[k3s:vars]
k3s_server_url=https://192.0.2.10:6443
